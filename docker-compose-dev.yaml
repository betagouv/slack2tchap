services:
  postgres:
    image: postgres:16-alpine
    container_name: slack2tchap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slack2tchap
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: slack2tchap_dev
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slack2tchap -d slack2tchap_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
