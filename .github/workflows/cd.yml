name: CD - Build & Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  ENVIRONMENT: development
  SECRET_ENCRYPTION_KEY: "ci-secret-encryption-key-for-tests-32b!"

jobs:
  build-linux-binaries:
    name: Build Linux x86_64 Standalone Binaries (3 projects)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (libolm)
        run: |
          sudo apt-get update
          sudo apt-get install -y libolm-dev libolm3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync

      - name: Build slack2tchap-core binary
        run: |
          uv run pyinstaller --clean --noconfirm --onefile \
            --name slack2tchap-core-linux-amd64 \
            slack2tchap-core/src/slack2tchap_core/cli.py

      - name: Build slack2tchap-stateless binary
        run: |
          uv run pyinstaller --clean --noconfirm --onefile \
            --name slack2tchap-stateless-linux-amd64 \
            slack2tchap-stateless/src/slack2tchap_stateless/main.py

      - name: Build slack2tchap (stateful) binary
        run: |
          uv run pyinstaller --clean --noconfirm --onefile \
            --name slack2tchap-linux-amd64 \
            slack2tchap/src/slack2tchap/main.py

      - name: Smoke test binaries
        run: |
          chmod +x dist/*
          file dist/*
          ./dist/slack2tchap-core-linux-amd64 --version
          ./dist/slack2tchap-stateless-linux-amd64 --help || true
          ./dist/slack2tchap-linux-amd64 --help || true

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slack2tchap-linux-amd64
            dist/slack2tchap-stateless-linux-amd64
            dist/slack2tchap-core-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
