[project]
name = "slack2tchap"
version = "0.1.0"
description = "Passerelle webhook Slack/Mattermost vers Matrix/Tchap avec support E2EE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.141.1",
    "markdown>=3.10.3",
    "matrix-nio[e2e]>=0.26.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused-arguments
    "ASYNC",  # flake8-async
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["slack2tchap"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
