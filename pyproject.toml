[project]
name = "slack2tchap-workspace"
version = "1.0.0"
description = "Monorepo workspace pour slack2tchap, slack2tchap-stateless et slack2tchap-core"
dependencies = [
    "slack2tchap-core",
    "slack2tchap-stateless",
    "slack2tchap",
]

[tool.uv.sources]
slack2tchap-core = { workspace = true }
slack2tchap-stateless = { workspace = true }
slack2tchap = { workspace = true }

[tool.uv.workspace]
members = [
    "slack2tchap-core",
    "slack2tchap-stateless",
    "slack2tchap",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "slack2tchap-core/src",
    "slack2tchap-stateless/src",
    "slack2tchap/src",
    "slack2tchap-core/tests",
    "slack2tchap-stateless/tests",
    "slack2tchap/tests",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG001",
    "ASYNC",
    "T20",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"slack2tchap-core/src/slack2tchap_core/cli.py" = ["T201"]
"slack2tchap-stateless/scripts/*" = ["T201"]
"slack2tchap/scripts/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["slack2tchap_core", "slack2tchap_stateless", "slack2tchap"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "slack2tchap-core/tests",
    "slack2tchap-stateless/tests",
    "slack2tchap/tests",
]
pythonpath = [
    "slack2tchap-core/src",
    "slack2tchap-stateless/src",
    "slack2tchap/src",
    "slack2tchap/tests",
    "slack2tchap-stateless/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
