[project]
name = "slack2tchap"
version = "1.0.0"
description = "Passerelle webhook multi-bot Slack vers Matrix / Tchap avec E2EE, persistance DB et gestion utilisateur"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slack2tchap-core",
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "certifi>=2024.0.0",
    "fastapi>=0.141.1",
    "matrix-nio[e2e]>=0.26.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
slack2tchap = "slack2tchap.main:run"

[tool.uv.sources]
slack2tchap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
